[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force
EnvironmentFile=
EnvironmentFile=/etc/caddy/moni.env
# Issue #93 M3 — Caddy is the internet-facing surface and terminates TLS, so a
# core dump could snapshot the TLS private key and in-flight plaintext (session
# cookies, bank credentials during connection-add). LimitCORE=0 applies the M1
# reasoning to the front door.
LimitCORE=0
NoNewPrivileges=yes
# A reverse proxy needs only CAP_NET_BIND_SERVICE. The distro unit also grants
# CAP_NET_ADMIN (an escalation primitive, used only to enlarge the HTTP/3 UDP
# buffer). Reset the additive AmbientCapabilities list, then re-grant the one
# cap, and cap the bounding set to match. Verified: caddy still binds 80/443 and
# serves valid TLS with no warnings on the box.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
