name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only the repository owner may trigger Claude, to prevent quota abuse on this public repo.
    if: |
      (github.event.comment.author_association == 'OWNER' || github.event.review.author_association == 'OWNER') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # Required for claude-code-action OIDC token exchange
    services:
      # Mirrors ci.yml's `test` job (and docker-compose.yml): same image, user,
      # password, port, and POSTGRES_DB=moni, so the suite's defaults in
      # tests/db/setup-test-db.ts resolve with no env override. POSTGRES_DB must
      # be `moni` — the bootstrap replays drizzle/*.sql, which hardcodes that
      # database name; see ci.yml for the full explanation.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # israeli-bank-scrapers -> puppeteer postinstall would fetch ~342MB of
      # Chromium. Nothing here launches a browser, so skip it (as ci.yml does).
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # Literals mirrored from ci.yml: dev-only material for a throwaway database
      # that dies with the runner, so there is nothing to protect. Several
      # tests/db/** files throw at import time without them.
      MONI_SIGNUP_TOKEN: ci-signup-token
      MONI_DEV_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      # Give Claude a working repo: Node + installed dependencies, so it can run
      # the gates (typecheck / lint / format:check / test) and `npm run build`
      # itself. Without this the runner is bare and every gate errors before it
      # starts. Mirrors ci.yml.
      - name: Set up Node and install dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # --model: pin the model used when Claude is tagged on this repo.
          # --effort medium: don't start the session in high thinking mode.
          # --allowedTools Bash: Bash is off by default; this lets Claude run the
          #   gates, the build, the Postgres-backed tests, and ad-hoc diagnostics.
          #   The base file-edit and PR-comment tools are always on and are not
          #   affected. Broad Bash is acceptable because the job's `if:` gates
          #   triggering to the repository OWNER only.
          claude_args: |
            --model claude-opus-4-8
            --effort medium
            --allowedTools Bash
