name: Deploy production

# A published GitHub Release is the only deployment trigger. The release tag
# resolves to the immutable SHA that is checked, built, recorded in the
# artifact manifest, and sent to the host.
on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Resolve tag and require green CI for the exact commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          test -n "$TAG" || { echo "::error::Release has no tag"; exit 1; }
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Release tag must match protected v* tags"; exit 1 ;;
          esac
          SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          test "${#SHA}" -eq 40 || { echo "::error::Could not resolve release tag"; exit 1; }
          relation=$(gh api "repos/$REPO/compare/$SHA...dev" --jq .status)
          case "$relation" in
            identical|ahead) ;;
            *) echo "::error::$SHA is not on the protected dev branch"; exit 1 ;;
          esac
          ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::No successful CI run for $SHA — refusing to deploy"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No production environment variable is exposed to these build steps.
      # The only values supplied are the public source SHA and Puppeteer's
      # download opt-out; migration credentials stay exclusively on the host.
      - name: Build immutable release artifact
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          deploy/package-release.sh "$RELEASE_SHA" moni-release.tar.gz

      - name: Ship verified artifact to the forced command
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is unset"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "::error::DEPLOY_KNOWN_HOSTS is unset"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          DIGEST=$(sha256sum moni-release.tar.gz | cut -d' ' -f1)
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" "deploy $RELEASE_SHA $DIGEST" < moni-release.tar.gz
