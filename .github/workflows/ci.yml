name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

# Nothing here deploys, so a run is worthless the moment a newer commit exists
# on the same ref — cancel it rather than race the newer run for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `israeli-bank-scrapers` depends on puppeteer, whose postinstall downloads
  # ~342MB of Chromium. Nothing in the suite launches a browser — the only
  # test that touches the library (tests/unit/connector-registry.test.ts) reads
  # the SCRAPERS metadata map and never calls .launch(). If a test ever does
  # drive a real browser, it will fail here with "browser not found" and this
  # line is what to remove.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # The four gates from AGENTS.md §5 that need no database, plus the
  # production build. Every step runs even when an earlier one fails, so one
  # run reports every problem instead of one per push.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run format:check
      # Runs last by preference, not by requirement: `next build` rewrites
      # tsconfig.json, which is why that file is prettier-ignored.
      - if: ${{ !cancelled() }}
        run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Mirrors docker-compose.yml exactly (same image, user, password, port)
      # so every default in tests/db/setup-test-db.ts resolves without a single
      # env override: TEST_SUPERUSER_URL defaults to postgres:postgres@
      # localhost:5432 and TEST_DATABASE_URL to moni_app@localhost:5432.
      #
      # POSTGRES_DB must be `moni` specifically. The test suite bootstraps an
      # isolated `moni_test` database by replaying drizzle/*.sql against it,
      # and drizzle/0001_rls_and_roles.sql hardcodes the literal database name
      # in three statements (`GRANT CONNECT ON DATABASE moni ...`, lines 79/81,
      # and `GRANT CREATE ON DATABASE moni ...`, line 95). Without a database
      # of that name on the server those raise 3D000, the single bootstrap
      # transaction rolls back, and every tests/db/** file fails with a
      # confusing "relation does not exist". Creating `moni` makes them
      # harmless no-ops, exactly as they are locally.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Deliberately a literal, not a repository secret. It gates signup
      # against an empty database that is destroyed with the runner, so there
      # is nothing to protect — and GitHub withholds secrets from
      # `pull_request` runs on forks, which on a public repo would make every
      # fork PR fail at import time (tests/db/registration.test.ts and nine
      # others throw when this is unset).
      MONI_SIGNUP_TOKEN: ci-signup-token
      # Same reasoning: dev-only key material for a throwaway database, and
      # `getDevUserDataKey` (src/lib/crypto/dev-key-provider.ts) fails closed
      # rather than defaulting, so tests/db/crypto.test.ts, domain-reads and
      # registration all throw at call time without it. Value is the
      # .env.example placeholder — base64 of 32 zero bytes, the exact length
      # the provider validates.
      MONI_DEV_DATA_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # End-to-end smoke layer (issue #9). Unlike `test`, this needs the whole app
  # running: it builds, migrates + seeds the real `moni` database, starts
  # `next start`, and drives Chromium against it. It is a separate job so a
  # browser regression is legible on its own and never blocks the fast checks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same throwaway Postgres as the `test` job. Here the app connects to the
      # real `moni` database (as `moni_app`), so this job migrates and seeds it
      # rather than bootstrapping an isolated `moni_test`.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runtime connection the app and the seed's RLS-scoped writes use.
      DATABASE_URL: postgresql://moni_app:moni_app_dev_password@localhost:5432/moni
      # Elevated connection for migrations and the seed's TRUNCATE/fx_rates
      # writes. It is the Postgres superuser rather than `moni_owner` on
      # purpose: on a brand-new database the `moni_owner` role does not exist
      # until drizzle/0001_rls_and_roles.sql creates it, so the very first
      # migrate must connect as the superuser (see .env.example's bootstrap
      # note). The roles it creates carry the dev passwords the app URL above
      # expects.
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/moni
      # Same literal as the `test` job — gates the seed's signup path against a
      # throwaway database (see that job's note on why it is not a secret).
      MONI_SIGNUP_TOKEN: ci-signup-token
      # The app refuses passkey routes until these agree; the smoke suite never
      # exercises a passkey, but the localhost defaults keep any settings page
      # that renders enrollment UI from throwing at import time.
      MONI_WEBAUTHN_RP_ID: localhost
      MONI_WEBAUTHN_ORIGIN: http://localhost:3000
      # Drive the runner's preinstalled Google Chrome (playwright.config.ts reads
      # this as the browser channel). Playwright's own browser download hangs on
      # this runner — the CDN fetch reaches 100% but the install then stalls to
      # the job timeout — so we launch an already-installed browser instead, with
      # nothing to download. ubuntu-latest ships google-chrome-stable.
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Confirm the browser we drive via channel is present, and fail loudly and
      # fast (not mid-test) if a future runner image ever drops it.
      - run: google-chrome --version
      - run: npm run db:migrate
      - run: npm run seed:demo
      - run: npm run build
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
